# Conexion a la base de datos de Supabase (Puerto 6543 para modo Transaction)
spring.datasource.url=jdbc:postgresql://aws-1-us-west-1.pooler.supabase.com:6543/postgres?prepareThreshold=0&preparedStatementCacheQueries=0&preparedStatementCacheSizeMB=0
spring.datasource.username=postgres.edjsxhzyaoachsivbmyv
spring.datasource.password=OxrLQRGUSqtzIJgZ

# Forzar el Driver de Postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de HikariCP
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.auto-commit=true

# Configuracion de Hibernate y JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true