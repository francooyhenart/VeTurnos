# Conexion a la base de datos de Supabase (Puerto 6543 para modo Transaction)
spring.datasource.url=jdbc:postgresql://aws-1-us-west-1.pooler.supabase.com:6543/postgres
spring.datasource.username=postgres.edjsxhzyaoachsivbmyv
spring.datasource.password=${DB_PASSWORD:contrase_generica}

# Limitar el pool de conexiones para no saturar el plan gratuito de Supabase
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1

# Forzar el Driver de Postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracion de Hibernate y JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect